# Nightly live smoke tests (conventions §10): every test marked `live` against the real
# upstream, on a schedule and on demand, never on a pull request.
# Rendered by the template (the one workflow that is): the secrets it names are the reserved
# tenant's credential, from the answer tenant_credential_env, then the keys of the answer
# source_dependencies (sdk-core ADR-0021) and the variables of the answer live_secrets, and
# its start time derives from the slug.
name: Live

on:
  schedule:
    # 02:37 UTC, staggered from the slug (live_schedule in sdk-template's copier.yml)
    # so that sources sharing a key do not start together.
    - cron: "37 2 * * *"
  workflow_dispatch:

# Hardened as every workflow of the family (conventions §13): the actions pinned to the
# commits ci.yml pins, the checkout keeps no credentials, the token reads only.
permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      # --tb=short: a failing test's frame arguments, a raw upstream payload among them,
      # stay out of a log that is public (conventions §10). --assert=plain: a failed
      # assertion prints the line and AssertionError alone, never the values it compared,
      # a record of the upstream among them, here or in the summary of -ra.
      - run: uv run pytest -m live --tb=short --assert=plain
        # The reserved tenant's credential, then the other variables the answers name, each
        # from the secret of the same name, for this step only: checkout, setup-uv and uv
        # sync never see them.
        env:
          XIPPIOS_LIVE_TESTS: "1"
          GOOGLE_DEMO_REFRESH_TOKEN: ${{ secrets.GOOGLE_DEMO_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
