# Nightly live smoke tests (conventions §10): every test marked `live` against the real
# upstream, on a schedule and on demand, never on a pull request.
# First rendered by the template (the one workflow that is): its start time derives from
# the slug. Edited by hand for the account model (ADR-0025): the template renders
# `_API_KEY` secrets only (queue row 255), so the pytest step is given the three org
# secrets the live tests need by name, the OAuth client pair every account shares and the
# reserved demo account's refresh token; GOOGLE_ACCOUNTS is never set, so the live tests
# reach the demo mailbox and nothing else (tests/conftest.py strips any other).
name: Live

on:
  schedule:
    # 02:37 UTC, derived from the slug (live_schedule in sdk-template's copier.yml).
    - cron: "37 2 * * *"
  workflow_dispatch:

# Hardened as every workflow of the family (conventions §13): the actions pinned to the
# commits ci.yml pins, the checkout keeps no credentials, the token reads only.
permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      # --tb=short: a failing test's frame arguments, a raw upstream payload among them,
      # stay out of a log that is public (conventions §10).
      - run: uv run pytest -m live --tb=short
        # The client pair and demo's refresh token, from the org secrets, for this step
        # only: checkout, setup-uv and uv sync never see them.
        env:
          XIPPIOS_LIVE_TESTS: "1"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DEMO_REFRESH_TOKEN: ${{ secrets.GOOGLE_DEMO_REFRESH_TOKEN }}
