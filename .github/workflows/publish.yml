# The release train (conventions §12, ADR-0018 amendment b): the release PR merges on
# main → this workflow tags vX.Y.Z from pyproject.toml on the merge commit → environment
# `pypi` → Johannes approves the run → trusted publishing uploads. No session and no human
# pushes the tag, and no token is stored anywhere.
#
# Every push to main runs it. `release-check` looks only at a push that changed
# pyproject.toml or CHANGELOG.md (every dispatch): a new source's first release PR changes
# no version, since the scaffold already says 0.1.0, only the CHANGELOG. It lets the push
# through when pyproject.toml's version has no tag yet and CHANGELOG.md has that version's
# `## [X.Y.Z] - ` heading. Anything else ends there quietly (an Unreleased entry on an
# ordinary PR among it), except a changed pyproject.toml whose version has no CHANGELOG
# section, which leaves a notice. CI runs here, once, for a release: ci.yml has no push
# trigger of its own (the strict up-to-date policy tests every tree before it merges).
# One workflow, because a tag pushed with GITHUB_TOKEN starts no other workflow. The file
# name stays publish.yml: PyPI's trusted publisher names it.
#
# Recovery. The tag precedes the build, so a build that fails for good leaves a tag
# without a release; the fix is a patch release. Once the tag exists, only "Re-run failed
# jobs" finishes the release: a dispatch or "Re-run all jobs" stops at release-check,
# which finds the tag. If the `pypi` environment's deployment-branch policy rejects main
# on the first run, Johannes sets the policy to `main` and re-runs the failed jobs. If
# `ci` fails before the tag, re-run the failed jobs rather than pushing a fix.
#
# Race. Runs are not serialised: GitHub's run groups keep one pending run and cancel it
# for the next, so a release run queued behind a run waiting at `pypi` would be lost.
# Two pushes to main close together can therefore both see an untagged version: the
# second run's tag push then fails red, or, if the first run's `ci` failed, the second
# tags a later commit. The fix: re-run the failed jobs of the run whose commit is the
# release; if the other run already tagged a later commit, Johannes rejects its `pypi`
# deployment and the release is re-done as a patch. A release is not merged while
# another release run is waiting.
name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Is this push a release?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::notice title=release-check::runs on main only, not on $REF; no tag"
            exit 0
          fi
          # A dispatch, or a push whose range cannot be read (a new or rewritten branch),
          # counts as a changed pyproject.toml.
          pyproject_changed=1
          if [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$SHA")"
            if ! grep -qx 'pyproject.toml' <<<"$changed"; then
              pyproject_changed=0
              if ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
                exit 0
              fi
            fi
          fi
          version="$(uv version --short)"
          if answer="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" 2>&1)"; then
            exit 0
          elif ! grep -q 'HTTP 404' <<<"$answer"; then
            echo "::error title=release-check::cannot read tag v${version}: ${answer}"
            exit 1
          fi
          heading="## [${version}] - "
          if ! awk -v h="$heading" 'index($0, h) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            if [ "$pyproject_changed" = 1 ]; then
              echo "::notice title=release-check::pyproject.toml names ${version}, but CHANGELOG.md has no '${heading}' heading; no tag"
            fi
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  ci:
    needs: release-check
    if: needs.release-check.outputs.version != ''
    uses: ./.github/workflows/ci.yml

  tag:
    name: tag
    needs: [release-check, ci]
    if: needs.release-check.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The one checkout that keeps its credentials: this job pushes the tag with the token
      # (conventions §13).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sdk-template's one step beyond core's file: a source that pins core to git cannot
      # be published (conventions §12), and core has no pin to guard. It stops the release
      # before the tag, so no tag is left without a release; the fix is the PR that removes
      # the pin (/release-prep), whose merge changes pyproject.toml and so tags the release.
      - name: Refuse a pyproject with [tool.uv.sources]
        run: |
          if grep -q '^\[tool\.uv\.sources\]' pyproject.toml; then
            echo "::error title=release::pyproject.toml has [tool.uv.sources]: a git-pinned core cannot be published"
            echo "Remove the pin and raise core_version to the core release in a PR of its own (/release-prep)."
            exit 1
          fi
      - name: Tag the merge commit with its CHANGELOG section
        id: tag
        env:
          VERSION: ${{ needs.release-check.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="v${VERSION}"
          message="${RUNNER_TEMP}/tag-message.md"
          awk -v h="## [${VERSION}] - " '
            index($0, h) == 1 { on = 1; print; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$message"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --cleanup=whitespace --file="$message" "$tag" "$SHA"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check that the tag matches pyproject version
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match project version ${version}"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
